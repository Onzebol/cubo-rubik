<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="CuboFácil" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // aplica el tema guardado antes de pintar, para que no haya parpadeo (misma clave que src/theme.ts)
      try { var t = localStorage.getItem('cubo-tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t) } catch (e) {}
    </script>
    <title>CuboFácil: aprende a resolver el cubo de Rubik</title>
    <meta name="theme-color" content="#14161c" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
